<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria - Controle de Estoque</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <!-- Cabeçalho (Header) -->
    <header>
        <h1><i class='bx bx-book-open'></i> Controle de Estoque</h1>
        <nav class="navbar">
            <a href="index.html" class="nav-link active"><i class='bx bx-plus-circle'></i> Cadastro & Dashboard</a>
            <a href="pages/estoque.html" class="nav-link"><i class='bx bx-list-ul'></i> Meu Estoque</a>
            <a href="pages/historico.html" class="nav-link"><i class='bx bx-history'></i> Movimentações</a>
        </nav>
    </header> <!-- Dashboard - Resumo das Informações -->
    <section class="dashboard">
        <div class="card"> <i class='bx bx-box card-icon'></i>
            <div>
                <h3>Total de Títulos</h3>
                <p id="totalProducts">0</p>
            </div>
        </div>
        <div class="card"> <i class='bx bx-layer card-icon'></i>
            <div>
                <h3>Total de Exemplares</h3>
                <p id="totalItems">0</p>
            </div>
        </div>
        <div class="card"> <i class='bx bx-dollar-circle card-icon'></i>
            <div>
                <h3>Valor em Estoque</h3>
                <p id="totalValue">R$ 0,00</p>
            </div>
        </div>
    </section> <!-- Área Principal -->
    <main>
        <!-- Bloco do Formulário (Glassmorphism) -->
        <div class="glass-container">
            <div class="form-header">
                <h2>Novo Título</h2>
            </div>
            <form id="productForm">
                <!-- Usado pelo JavaScript para saber quando estamos editando um item --> <input type="hidden"
                    id="editId">
                <div class="input-group">
                    <div class="input-box"> <label for="name">Título do Livro</label> <input type="text" id="name"
                            required placeholder="Ex: O Deus esquecido..."> </div>
                    <div class="input-box"> <label for="author">Autor(a)</label> <input type="text" id="author"
                            required placeholder="Ex: Luciano Subirá..."> </div>

                    <div class="input-box">
                        <label for="quantity">Quantidade</label>
                        <input type="number" id="quantity" required min="0" placeholder="Ex: 3, 10...">
                    </div>
                    <div class="input-box"> <label for="price">Preço Unitário (R$)</label> <input type="number"
                            id="price" required step="0.01" min="0" placeholder="Ex: 45.90"> </div>
                    <!-- Novo Item solicitado: Data de Registro -->
                    <div class="input-box"> <label for="date">Data de Registro</label> <input type="date" id="date"
                            required> </div>
                </div> <button type="submit" class="btn-primary" id="submitBtn"> <i class='bx bx-plus'></i> Salvar
                    Livro </button>
            </form>
        </div>
    </main>
    <script src="js/global.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
